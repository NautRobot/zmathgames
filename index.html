<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeke Math Games</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 2;
    }
    h1 {
      color: #1e3c72;
      margin-bottom: 10px;
      font-size: 2.5rem;
    }
    .points-box {
      background: linear-gradient(135deg, #e8f0fe 0%, #cce0ff 100%);
      border: 2px solid #1e3c72;
      border-radius: 10px;
      padding: 15px;
      margin: 20px 0;
      font-size: 1.4rem;
      font-weight: bold;
      color: #1e3c72;
    }
    /* SLOT MACHINE STYLES */
    .slots-section {
      margin: 25px 0;
      padding: 20px;
      background: #2c3e50;
      border-radius: 12px;
      color: white;
      border: 4px solid #f1c40f;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .slots-section h3 {
      margin-top: 0;
      color: #f1c40f;
      font-size: 1.5rem;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    .slot-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }
    .reel {
      width: 70px;
      height: 70px;
      background: white;
      color: black;
      border-radius: 8px;
      font-size: 2.5rem;
      line-height: 70px;
      font-weight: bold;
      border: 3px solid #7f8c8d;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s ease-in-out;
    }
    .spinning {
      animation: bounce 0.1s infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(-5px); }
      to { transform: translateY(5px); }
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .bet-select {
      padding: 8px 15px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      border: 2px solid #f1c40f;
      background-color: #34495e;
      color: white;
      cursor: pointer;
    }
    .spin-btn {
      padding: 12px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #c0392b;
      transition: all 0.1s;
    }
    .spin-btn:hover {
      background-color: #ff6b6b;
    }
    .spin-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .spin-btn:disabled {
      background-color: #95a5a6;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
    .result-message {
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 24px;
      margin-top: 10px;
      color: #f1c40f;
    }
    .button-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 25px;
    }
    .redirect-btn {
      display: block;
      padding: 15px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      text-decoration: none;
      border-radius: 8px;
      transition: transform 0.2s, background 0.2s;
    }
    .redirect-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
    }

    /* MONEY EMOJI RAIN CANVAS OVERLAY */
    #moneyCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

    <div class="button-list">
      <a href="https://nautrobot.github.io/z-clicker" class="redirect-btn">
        Legacy Z-Clicker; Click away and upgrade your Zekes to form an army!
      </a>
      <a href="https://nautrobot.github.io/z-clicker-remastered" class="redirect-btn">
        Z-Clicker REMASTERED!; Click away to make Zeke gassy until he explodes!
      </a>
      <a href="https://nautrobot.github.io/z-tetris" class="redirect-btn">
        Z-Tetris!; Stack and Score in this Zeke themed Tetris!
      </a>
      <a>
        MORE COMING SOON! EMAIL FEEDBACK TO s1002796@student.knoxschools.org
      </a>
    </div>
  </div>
  </script>
</body>
</html>
