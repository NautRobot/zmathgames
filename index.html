<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zekemathgames</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; text-align: center; padding: 50px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; }
        .points-badge { font-size: 1.5rem; color: #1e3c72; font-weight: bold; background: #e8f0fe; padding: 10px; border-radius: 8px; margin: 15px 0; }
        .shop-btn { padding: 10px 20px; font-weight: bold; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>zekemathgames</h1>
        
        <!-- Live Global Points Balance -->
        <div class="points-badge">
            Global Points: <span id="globalPoints">Loading...</span>
        </div>

        <img src="zeke.jpg" alt="Zeke Math Games" class="main-image" style="max-width:200px;">

        <!-- Sample Home Site Shop Item -->
        <div style="margin: 20px 0;">
            <h3>Home Shop</h3>
            <button class="shop-btn" onclick="spendPoints(50)">Unlock Golden Zeke Avatar (Cost: 50 Points)</button>
        </div>

        <div class="button-list">
            <a href="https://nautrobot.github.io/z-clicker" target="_blank" class="redirect-btn">Z-Clicker</a>
            <a href="https://nautrobot.github.io/z-tetris" target="_blank" class="redirect-btn">Z-Tetris</a>
            <a href="https://nautrobot.github.io/z-pacman" target="_blank" class="redirect-btn">Z-Pacman</a>
        </div>
    </div>

    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCyD2K3TT7hOfakFPgJ9mMjTEM8Jim9_rA",
          authDomain: "z-clicker-97488.firebaseapp.com",
          projectId: "z-clicker-97488",
          databaseURL: "https://z-clicker-97488-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        signInAnonymously(auth);

        onAuthStateChanged(auth, (user) => {
          if (user) {
            const pointsRef = ref(db, `users/${user.uid}/points`);

            // 1. Read live points
            onValue(pointsRef, (snapshot) => {
              document.getElementById('globalPoints').innerText = snapshot.val() || 0;
            });

            // 2. Function to deduct points safely
            window.spendPoints = function(cost) {
              runTransaction(pointsRef, (currentPoints) => {
                if ((currentPoints || 0) >= cost) {
                  return currentPoints - cost;
                } else {
                  return; // Abort transaction if insufficient points
                }
              }).then((result) => {
                if (result.committed) {
                  alert("Successfully purchased!");
                } else {
                  alert("Not enough points!");
                }
              });
            };
          }
        });
    </script>
</body>
</html>
