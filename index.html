<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zekemathgames</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        .points-box {
            background: linear-gradient(135deg, #e8f0fe 0%, #cce0ff 100%);
            border: 2px solid #1e3c72;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-size: 1.4rem;
            font-weight: bold;
            color: #1e3c72;
        }
        .main-image {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .button-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .redirect-btn {
            display: block;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s, background 0.2s;
        }
        .redirect-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
        }
        .shop-section {
            margin: 25px 0;
            padding: 15px;
            border-top: 2px dashed #ccc;
        }
        .buy-btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>zekemathgames</h1>
        
        <!-- Live Points Display -->
        <div class="points-box">
            ⚡ Total Zeke Points: <span id="globalPointsDisplay">Loading...</span>
        </div>

        <img src="zeke.jpg" alt="Zeke Math Games" class="main-image">

        <!-- Sample Point Shop -->
        <div class="shop-section">
            <h3>Home Shop</h3>
            <p>Earn 1 Point for every 1 minute of active play on any Zeke game!</p>
            <button class="buy-btn" onclick="spendPoints(5)">Buy Golden Zeke Badge (5 Points)</button>
        </div>

        <div class="button-list">
            <a href="https://nautrobot.github.io/z-clicker" target="_blank" class="redirect-btn">Z-Clicker; Click away and upgrade your Zekes to form an army!</a>
            <a href="https://nautrobot.github.io/z-tetris" target="_blank" class="redirect-btn">Z-Tetris; Stack and score with these small Zekes.</a>
            <a href="https://nautrobot.github.io/z-pacman" target="_blank" class="redirect-btn">Z-Pacman; Eat the little Zekes and run from the evil ones!</a>
        </div>
    </div>

    <!-- FIREBASE HOME ENGINE -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCyD2K3TT7hOfakFPgJ9mMjTEM8Jim9_rA",
        authDomain: "z-clicker-97488.firebaseapp.com",
        projectId: "z-clicker-97488",
        storageBucket: "z-clicker-97488.firebasestorage.app",
        messagingSenderId: "686862323992",
        appId: "1:686862323992:web:e25c46b7deb67254278e6d",
        databaseURL: "https://z-clicker-97488-default-rtdb.firebaseio.com" 
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);

      signInAnonymously(auth).catch(console.error);

      onAuthStateChanged(auth, (user) => {
        if (user) {
          const userPointsRef = ref(db, `users/${user.uid}/points`);

          // Live update the points text when points change
          onValue(userPointsRef, (snapshot) => {
            const points = snapshot.val() || 0;
            document.getElementById('globalPointsDisplay').innerText = points.toLocaleString();
          });

          // Spending points handler
          window.spendPoints = function(cost) {
            runTransaction(userPointsRef, (currentPoints) => {
              const available = currentPoints || 0;
              if (available >= cost) {
                return available - cost;
              } else {
                return; // Abort if insufficient points
              }
            }).then((result) => {
              if (result.committed) {
                alert("Purchase successful!");
              } else {
                alert("Not enough points! Play games to earn more.");
              }
            });
          };
        }
      });
    </script>

</body>
</html>
