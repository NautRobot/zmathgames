<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zekemathgames</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #1e3c72;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        .main-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .button-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .redirect-btn {
            display: block;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s, background 0.2s;
        }
        .redirect-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>zekemathgames</h1>
        
        <!-- Make sure zeke.jpg is in the same folder as this HTML file -->
        <img src="zeke.jpg" alt="Zeke Math Games" class="main-image">

        <div class="button-list">
            <a href="https://nautrobot.github.io/z-clicker" target="_blank" class="redirect-btn">Z-Clicker; Click away and upgrade your Zekes to form an army!</a>
            <a href="https://nautrobot.github.io/z-tetris" target="_blank" class="redirect-btn">Z-Tetris; Stack and score with these small Zekes.</a>
            <a href="https://nautrobot.github.io/z-pacman" target="_blank" class="redirect-btn">Z-Pacman; Eat the little Zekes and run from the evil ones!</a>
        </div>
    </div>

</body>
</html>
